server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /unihome
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5s
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: unihome
    table: flyway_schema_history
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_schema: unihome
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR-SECRET}
            scope: openid,profile,email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  signerKey: ${JWT_SIGNER_KEY:YOUR_JWT_KEY}
  valid-duration: ${JWT_VALID_DURATION:36000}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:360000}

openapi:
  title: API document
  version: v1.0.0
  description: API service
  serverUrl: ${OPENAPI_SERVER_URL:http://localhost:8080/unihome}
  serverName: ${OPENAPI_SERVER_NAME:Localhost Dev Server}

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
SENDGRID_API_KEY: ${SENDGRID_API}
FE_URL: ${PAGE_URL}
