spring:

  datasource:
    driver-class-name: org.postgresql.Driver
    # url / username / password -> Testcontainers inject
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh';
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: unihome
    table: flyway_schema_history

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: unihome

  data:
    redis:
      # host / port -> Testcontainers inject
      timeout: 5s

jwt:
  signerKey: test-sign-key
  valid-duration: 36000
  refreshable-duration: 360000
