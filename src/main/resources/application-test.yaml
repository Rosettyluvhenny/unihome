server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /unihome

spring:

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: unihome
    table: flyway_schema_history
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    properties:
      hibernate:
        default_schema: unihome
jwt:
  signerKey: ${JWT_SIGNER_KEY:6a1cb621034ba5799fcab51bf3abd3aed423bbea68d559782c02a7f4954cf3556fae79dba9ca362109de89dd4604660f52e9fe73cf7719a69e2ab5d06eba71ba}
  valid-duration: ${JWT_VALID_DURATION:36000}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:360000}

openapi:
  title: API document
  version: v1.0.0
  description: API service
  serverUrl: ${OPENAPI_SERVER_URL:http://localhost:8080/unihome}
  serverName: ${OPENAPI_SERVER_NAME:Localhost Dev Server}

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
