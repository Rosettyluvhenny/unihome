name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java + cache Maven dependencies
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Run tests
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          FLYWAY_ENABLED: true
        run: mvn -B test

      # 4️⃣ Build JAR
      - name: Build JAR
        run: mvn -B clean package -DskipTests


